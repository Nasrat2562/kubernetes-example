<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Workspace | Kubernetes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e1e2f 0%, #0f0f1a 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        .container {
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { font-size: 3rem; margin-bottom: 10px; color: #61dafb; }
        p { font-size: 1.2rem; color: #888; margin-bottom: 30px; }
        .badge {
            display: inline-block;
            padding: 8px 20px;
            background: #4caf50;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kubernetes Active</h1>
        <p>Local Environment Bridged Successfully</p>
        <div class="badge">PHP & LARAVEL READY</div>
    </div>
</body>
</html>
